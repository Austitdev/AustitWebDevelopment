# Lokale Entwicklungsumgebung fuer die austit Cloud.
# Das Repo muss im WSL-Dateisystem liegen (z.B. ~/PhpstormProjects/untitled in Ubuntu), auf C:\
# braucht jede Seite wegen des langsamen Windows-Mounts mehrere Sekunden.
# Start (in WSL):  docker compose -f austit-dev/docker-compose.yml up -d
# Start:  docker compose -f austit-dev/docker-compose.yml up -d
# Aufruf: http://localhost:8080  (Login: admin / admin)
name: austit-cloud-dev

services:
  app:
    image: nextcloud:35.0.2-apache
    entrypoint: ["/bin/sh", "/var/www/html/austit-dev/entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8080:80"
      # Windows loest localhost zuerst als ::1 auf, ohne diese Bindung wartet jede neue Verbindung ca. 200 ms.
      - "[::1]:8080:80"
    volumes: &app-volumes
      - ..:/var/www/html
      - ./dev.config.php:/var/www/html/config/dev.config.php:ro
      - ./austit.config.php:/var/www/html/config/austit.config.php:ro
      - ./php-austit.ini:/usr/local/etc/php/conf.d/zz-austit.ini:ro
      - ./apache-austit.conf:/etc/apache2/conf-enabled/zz-austit.conf:ro
      - ./apache-dev.conf:/etc/apache2/conf-enabled/zz-austit-dev.conf:ro
      - data:/var/www/html/data
      - custom-apps:/var/www/html/custom_apps

  # Hintergrundaufgaben jede Minute. Talk bietet den Nachrichtenablauf nur im Cron-Modus an,
  # und abgelaufene Nachrichten und Dateien werden von diesen Aufgaben geloescht.
  cron:
    image: nextcloud:35.0.2-apache
    entrypoint: ["/bin/sh", "/var/www/html/austit-dev/cron.sh"]
    depends_on:
      - app
      - redis
    volumes: *app-volumes

  # Office-Bearbeitung (docx, xlsx, pptx, odt, ...), gleiche Version wie auf dem VPS.
  collabora:
    image: collabora/code:26.04.5.1.1
    environment:
      aliasgroup1: http://app:80
      DONT_GEN_SSL_CERT: "1"
      extra_params: >-
        --o:ssl.enable=false
        --o:net.frame_ancestors=localhost:8080
        --o:help_url=https://austit.de
        --o:user_interface.brandProductName=AUSTIT
        --o:user_interface.brandProductURL=https://austit.de
    ports:
      - "127.0.0.1:9980:9980"
      - "[::1]:9980:9980"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

volumes:
  data:
  custom-apps:
  db:
