;
; PHP-Einstellungen der austit Cloud (im Container als conf.d/zz-austit.ini eingebunden).

; Kein "X-Powered-By: PHP/x.y" in den Antworten.
expose_php = Off

; Mehr Cache fuer die umfangreiche Nextcloud-Codebasis.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 2
opcache.validate_timestamps = 1
opcache.jit_buffer_size = 0
realpath_cache_size = 32M
realpath_cache_ttl = 600

; APCu wird fuer den lokalen Nextcloud-Cache verwendet.
apc.shm_size = 128M
