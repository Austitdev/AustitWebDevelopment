# Apache-Einstellungen nur fuer die lokale Dev-Instanz (im Container als conf-enabled/zz-austit-dev.conf eingebunden).

# Im Debug-Modus haengt Nextcloud keine Versionsnummer an Skripte und Styles an. Ohne diese Regel
# behaelt der Browser sie laut .htaccess ein halbes Jahr und zeigt neue Builds nicht an.
# Der <If>-Block ist noetig, weil die .htaccess den Header ebenfalls in einem <If> setzt und
# solche Bloecke erst nach <LocationMatch> ausgewertet werden.
<LocationMatch "\.(css|js|mjs)$">
	<If "true">
		Header set Cache-Control "no-cache"
	</If>
</LocationMatch>
