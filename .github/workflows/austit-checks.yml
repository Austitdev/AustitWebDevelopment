name: austit checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: austit-checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP lint & coding standard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up php
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: sodium, mbstring, xml, curl, zip, zlib, sqlite, pdo_sqlite
          coverage: none

      - name: Set up dependencies
        run: composer i

      - name: PHP syntax check
        run: find apps/austit_talk apps/austit_notebook apps/austit_medien apps/austit_shell apps/austit_updates -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Coding standard
        run: |
          lib/composer/bin/php-cs-fixer fix --dry-run --diff --config .php-cs-fixer.dist.php \
            apps/austit_talk \
            apps/austit_notebook \
            apps/austit_medien \
            apps/austit_shell \
            apps/austit_updates \
            || ( echo 'Please run `composer run cs:fix` to format your code' && exit 1 )

  phpunit:
    name: PHPUnit austit apps (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Set up php
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, sodium, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development
          ini-values: disable_functions=""

      - name: Set up dependencies
        run: composer i

      - name: Set up Nextcloud
        run: |
          mkdir data
          cp tests/preseed-config.php config/config.php
          ./occ maintenance:install --verbose --database=sqlite --database-name=nextcloud --database-user=root --database-pass=rootpassword --admin-user admin --admin-pass admin
          # Talk is not part of this repository; its tables are needed by the tests
          curl -fL -o /tmp/spreed.tar.gz https://github.com/nextcloud-releases/spreed/releases/download/v25.0.8/spreed-v25.0.8.tar.gz
          tar -xzf /tmp/spreed.tar.gz -C apps/
          ./occ app:enable spreed austit_talk austit_notebook austit_medien austit_shell austit_updates

      - name: PHPUnit
        run: |
          lib/composer/bin/phpunit --configuration tests/phpunit-autotest.xml \
            apps/austit_talk \
            apps/austit_notebook \
            apps/austit_medien \
            apps/austit_shell \
            apps/austit_updates

      - name: Print logs
        if: failure()
        run: |
          echo "=== data/nextcloud.log ==="
          cat data/nextcloud.log || true

  notebook:
    name: austit_notebook node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/austit_notebook
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
