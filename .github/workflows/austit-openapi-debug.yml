name: austit openapi debug

on:
  push:
    branches: ['vibe/austit-openapi-039ccd']

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up php
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, gd, json, libxml, mbstring, openssl, pcntl, pdo, posix, session, simplexml, xml, xmlreader, xmlwriter, zip, zlib
          coverage: none
          ini-file: development

      - name: Set up dependencies
        run: composer i

      - name: OpenAPI checker
        run: bash build/openapi-checker.sh || echo "checker reports changes"

      - name: Print matching files
        if: always()
        run: |
          files="$(git ls-files --exclude-standard --modified --others)"
          echo "$files" | grep -i openapi || echo "no openapi file in list"
          for file in $files; do
            if [[ $file == *"openapi"*.json ]]; then
              echo "MATCH: $file"
            fi
          done
          git --no-pager diff --stat
